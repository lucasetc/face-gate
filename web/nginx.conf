# Nginx do FaceGate: serve o React e encaminha /api para o API Gateway do
# LocalStack. O navegador só fala com uma origem (localhost:8088): sem CORS e
# sem depender de DNS externo. Na AWS, o CloudFront faria esse mesmo papel.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 10m;          # fotos em base64
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;

    # Resolve o nome "localstack" a cada 10 s pelo DNS do Docker: o proxy
    # continua funcionando mesmo se o contêiner do LocalStack for reiniciado.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $localstack http://localstack:4566;

    # /api/moradores → API Gateway (API "facegate", stage "dev")
    location /api/ {
        rewrite ^/api/(.*)$ /_aws/execute-api/facegate/dev/$1 break;
        proxy_pass $localstack;
        proxy_set_header Origin "";
        proxy_read_timeout 60s;
    }

    # Saúde dos serviços emulados (painel de infraestrutura)
    location = /localstack/health {
        rewrite ^ /_localstack/health break;
        proxy_pass $localstack;
        proxy_set_header Origin "";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
